name: Проверки

# Прогоняется на каждый пуш и запрос на слияние: типы, тесты, сборка и сквозной
# сценарий против поднятой базы. Секреты для этого не нужны — сборка их не требует.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Типы, тесты и сквозной сценарий
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skilllink
          POSTGRES_PASSWORD: skilllink
          POSTGRES_DB: skilllink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skilllink -d skilllink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skilllink:skilllink@localhost:5432/skilllink?schema=public
      APP_BASE_URL: http://localhost:3000
      # Не короче 32 знаков: промышленный сервер с коротким секретом не стартует
      # (src/shared/config/env.ts, решение 133). Значение — только для CI.
      AUTH_SECRET: ci-only-signing-secret-not-for-production-0123456789
      DEMO_AUTH_ENABLED: 'true'
      # Пробник проверяет отказ 429 на своём счёте с этим пределом (решение 117).
      RATE_LIMIT_TEST_OVERRIDE: '5'

    steps:
      - uses: actions/checkout@v7

      # checkout и setup-node — седьмые версии: четвёртые работали на Node 20,
      # который GitHub выводит из обращения, и каждый прогон предупреждал об этом.
      #
      # 22 разворачивается в последнюю 22.x — она выше 22.12, которую требует
      # Prisma 7. Требование записано в package.json, и engine-strict остановит
      # установку, если однажды окажется иначе.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall генерирует клиент Prisma — он нужен и типам, и тестам.
      - name: Установка зависимостей
        run: npm ci

      # Ворота выкладки (решение 137): schema.prisma должна совпадать с тем, что
      # получится, если проиграть подряд все миграции prisma/migrations. Расхождение —
      # кто-то поменял схему и забыл (или не смог) создать миграцию: `migrate deploy`
      # на сервере применит старые миграции и оставит базу не такой, как в schema.prisma,
      # без единой ошибки. Сверка — в отдельной базе (SHADOW_DATABASE_URL): Prisma
      # проигрывает в ней миграции и сравнивает результат со схемой, ничего не трогая
      # в базе тестов.
      - name: Пустая база для сверки миграций со схемой
        run: |
          PGPASSWORD=skilllink psql -h localhost -U skilllink -d skilllink \
            -c 'CREATE DATABASE skilllink_shadow;'

      - name: Схема совпадает с миграциями
        env:
          SHADOW_DATABASE_URL: postgresql://skilllink:skilllink@localhost:5432/skilllink_shadow?schema=public
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code \
          || (echo "schema.prisma разошлась с prisma/migrations: создайте миграцию (npx prisma migrate dev)" && exit 1)

      - name: Проверка типов
        run: npm run typecheck

      # Падает только на правилах уровня error — настоящих ошибках (eslint.config.mjs).
      # Предупреждения прогон не валят, их число по правилам — в сводке следующим шагом.
      - name: Линтер
        id: lint
        run: npm run lint

      - name: Предупреждения линтера в сводку
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: |
          npx eslint . --format json --output-file "$RUNNER_TEMP/eslint.json" || true
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))
            const counts = {}
            for (const file of report) for (const m of file.messages) {
              const key = (m.severity === 2 ? "ошибка" : "предупреждение") + " | `" + (m.ruleId ?? "разбор файла") + "`"
              counts[key] = (counts[key] ?? 0) + 1
            }
            const rows = Object.entries(counts).sort((a, b) => b[1] - a[1])
            console.log("### Линтер\n")
            if (rows.length === 0) { console.log("Замечаний нет."); process.exit(0) }
            console.log("| Уровень | Правило | Число |\n| --- | --- | --- |")
            for (const [key, n] of rows) console.log("| " + key + " | " + n + " |")
          ' "$RUNNER_TEMP/eslint.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Модульные тесты
        run: npm test

      - name: Спецификация OpenAPI не разошлась с кодом
        run: |
          npm run openapi
          git diff --exit-code docs/openapi.json \
            || (echo "docs/openapi.json устарел: выполните npm run openapi и закоммитьте" && exit 1)

      - name: Сборка
        run: npm run build

      - name: Миграции и демонстрационные данные
        run: |
          npm run db:deploy
          npm run db:seed
          npm run db:verify -- --demo

      # Цепочка журнала на настоящей базе (решение 115): подмена и удаление строк,
      # отрезанный хвост, чистка по сроку, 20 параллельных вставок. Во временной схеме —
      # журнал демо-набора не трогается. Без TEST_DATABASE_URL `npm test` этот набор пропускает.
      - name: Цепочка журнала на базе
        run: npx vitest run src/modules/audit/chain.db.test.ts
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Запуск приложения
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/ready && break
            sleep 2
          done

      - name: Сквозной сценарий
        run: npm run smoke

      - name: Пробник
        run: npm run probe

      # Правила данных после записей сквозного сценария и пробника:
      # приложение само не оставляет противоречивых записей (scripts/db-verify.ts).
      - name: Целостность данных
        run: npm run db:verify
