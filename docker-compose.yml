services:
  postgres:
    image: postgres:16-alpine
    container_name: skilllink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skilllink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skilllink}
      POSTGRES_DB: ${POSTGRES_DB:-skilllink}
    ports:
      # Порт наружу настраивается: на машине разработчика PostgreSQL часто уже
      # занимает 5432, и стек не поднимется без возможности выбрать другой.
      #
      # Только 127.0.0.1: без адреса Docker открывает порт на всех интерфейсах,
      # и на машине с публичным IP база с паролем по умолчанию видна из интернета.
      # Docker при этом обходит firewall хоста (ufw), так что тот не спасает.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - skilllink-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-skilllink} -d ${POSTGRES_DB:-skilllink}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Приложение поднимается профилем: `docker compose --profile app up -d`.
  # Без профиля запускается только база — так удобнее разрабатывать локально.
  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skilllink-app
    restart: unless-stopped
    # Остановка (выкладка, docker stop) — сначала SIGTERM: Next перестаёт принимать
    # соединения и дожидается начатых запросов, потом выходит сам. По умолчанию Docker
    # ждёт 10 с и добивает SIGKILL — долгая выгрузка оборвалась бы на середине.
    # Фоновых задач внутри процесса нет (решение 118): сводки и копии — cron владельца.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skilllink}:${POSTGRES_PASSWORD:-skilllink}@postgres:5432/${POSTGRES_DB:-skilllink}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # ВНИМАНИЕ: имена переменных здесь намеренно НЕ совпадают с теми, что лежат
      # в .env проекта.
      #
      # Compose подставляет значения из .env в каталоге проекта, а первым шагом
      # установки человек делает `cp .env.example .env` — и в контейнер утекали
      # разработческие значения: DEMO_AUTH_ENABLED=true, то есть вход без пароля
      # вообще, и локальный секрет подписи. Контейнер при этом считался
      # промышленным, и README обещал, что демо-режим в нём выключен.
      #
      # Отдельные имена разрывают эту связь: что бы ни лежало в .env, контейнер
      # получает безопасные значения, а включить демо-режим можно только явно.

      # Секрет подписи сессий. Пустой — приложение откажется стартовать
      # в промышленном режиме с понятным сообщением (src/shared/auth/auth.ts).
      # Сгенерировать:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      AUTH_SECRET: ${DOCKER_AUTH_SECRET:-}
      # Вход без пароля по cookie. Включается только осознанно и только для показа.
      DEMO_AUTH_ENABLED: ${DOCKER_DEMO_AUTH_ENABLED:-false}
      # Публичный адрес, если перед приложением стоит прокси с HTTPS:
      #   DOCKER_AUTH_URL=https://skilllink.example
      # Без него после входа пользователя отправит на https://localhost:3000 —
      # Next.js собирает адрес запроса из собственного имени, а не из заголовка Host,
      # и NextAuth строит по нему все переходы. Пустое значение безопасно:
      # next-auth считает его незаданным (проверено).
      AUTH_URL: ${DOCKER_AUTH_URL:-}
      # Ключ HMAC для почты и телефона слушателей в заказах с сайта (решение 132).
      # Пустой — ключ выводится из AUTH_SECRET (решение 132), отдельный задавать необязательно.
      # На стенде создаётся развёртыванием в .env.cloud (scripts/deploy/deploy.sh).
      ORDERS_HMAC_KEY: ${DOCKER_ORDERS_HMAC_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      LMS_ENABLED: ${LMS_ENABLED:-false}
      SITE_ENABLED: ${SITE_ENABLED:-false}
      # Быстрый вход экспертов хакатона (решение 176): кнопки на /login без пароля,
      # только для учётных записей is_reviewer = true (решение 147). По умолчанию
      # выключено — на стенде включает владелец перед показом.
      EXPERT_QUICK_LOGIN: ${EXPERT_QUICK_LOGIN:-false}
      # ИИ-помощник (решение 90). По умолчанию выключен — черновики пишутся шаблоном.
      # Ключи задаются только в .env.cloud на сервере: docs/DEPLOY.md,
      # раздел «Как подключить YandexGPT». В git их нет.
      AI_ASSIST_PROVIDER: ${AI_ASSIST_PROVIDER:-off}
      AI_ASSIST_TIMEOUT_MS: ${AI_ASSIST_TIMEOUT_MS:-15000}
      YANDEX_GPT_API_KEY: ${YANDEX_GPT_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_GPT_MODEL: ${YANDEX_GPT_MODEL:-yandexgpt-lite}
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_CA_CERT_PATH: ${GIGACHAT_CA_CERT_PATH:-}
      # Уведомления в Telegram (решение 102). По умолчанию выключены. Токен и секрет —
      # только в .env.cloud на сервере: docs/SETUP.md, «Бот уведомлений в Telegram».
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      TELEGRAM_API_IP: ${TELEGRAM_API_IP:-}
      # Режим приёма обновлений (решение 142). Без этой строки TELEGRAM_MODE из
      # .env.cloud в контейнер не попадал, и стенд всегда стартовал в auto.
      TELEGRAM_MODE: ${TELEGRAM_MODE:-auto}
      # Каналы уведомлений: MAX и VK (решение 144). По умолчанию выключены — на этом
      # хакатоне боевых токенов нет и не будет, канал остаётся «для галочки» в
      # интерфейсе. Ключи — только в .env.cloud: docs/SETUP.md, «Каналы уведомлений:
      # MAX и VK».
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_API_BASE: ${MAX_API_BASE:-}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_CONFIRMATION_CODE: ${VK_CONFIRMATION_CODE:-}
      VK_SECRET: ${VK_SECRET:-}
      VK_API_VERSION: ${VK_API_VERSION:-}
      VK_API_BASE: ${VK_API_BASE:-}
      # Контрольная группа рекомендаций (решение 126). По умолчанию выключена: на стенде
      # показа сценарий опирается на рекомендации, прятать их нельзя.
      RECOMMENDATION_EXPERIMENT: ${RECOMMENDATION_EXPERIMENT:-off}
      # Оповещения владельцу о событиях безопасности (решение 118): кроме администраторов
      # с привязанным Telegram — ещё этот чат. Пусто — только администраторам.
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      # Метрики сервера (решение 137). Токен пуст — читает только сама машина
      # приложения; BACKUP_STATUS_FILE пуст — метрик копии нет (нечего копировать
      # локально). APP_COMMIT задаёт развёртывание (remote-up.sh), не человек.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-}
      APP_COMMIT: ${APP_COMMIT:-}
      # Реквизиты оператора ПД для выгрузки «всё о субъекте» (решение 116/139).
      # Пусто — понятная заглушка «ИТ-Школа РТК (реквизиты указываются при внедрении)»
      # (src/shared/config/dsar.config.ts): система работает и без них.
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
      # Файлы к документам и этапам (решение 145): каталог хранения на диске.
      # Путь внутри контейнера — совпадает с точкой монтирования тома ниже.
      UPLOADS_DIR: /data/uploads
      # Токен машинной интеграции для приёма данных извне (решение 145, ТЗ функц. п.5):
      # POST /api/import/external. Пусто — маршрут отвечает 503 «интеграция не настроена».
      INTEGRATION_TOKEN: ${INTEGRATION_TOKEN:-}
    ports:
      # Только 127.0.0.1 — по той же причине. Снаружи приложение открывают
      # через прокси с HTTPS (deploy/yandex-cloud), а не напрямую.
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      # Файлы, приложенные к документам и этапам (решение 145): переживают
      # пересоздание контейнера при выкладке, как и база данных.
      - skilllink-uploads:/data/uploads

  # Разовая задача: применить миграции.
  #   docker compose --profile migrate run --rm migrate
  #
  # Собирается из ступени builder, а не из готового образа: в рантайм-образе лежит
  # только standalone-сервер, и CLI Prisma там намеренно нет.
  migrate:
    profiles: ['migrate']
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: skilllink-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skilllink}:${POSTGRES_PASSWORD:-skilllink}@postgres:5432/${POSTGRES_DB:-skilllink}?schema=public
      # Для рассылки сводки по каналам уведомлений по расписанию (npm run
      # telegram:digest, docs/DEPLOY.md): те же боты и публичный адрес стенда
      # для ссылок в тексте сводки.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      TELEGRAM_API_IP: ${TELEGRAM_API_IP:-}
      # MAX и VK (решение 144) — только то, что нужно для отправки, без секретов
      # вебхука/Callback API: рассылка не принимает входящие.
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_API_BASE: ${MAX_API_BASE:-}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN:-}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_API_VERSION: ${VK_API_VERSION:-}
      VK_API_BASE: ${VK_API_BASE:-}
      AUTH_URL: ${DOCKER_AUTH_URL:-}
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

  # Метрики и оповещения (решение 137) — по решению владельца, не по умолчанию:
  #   docker compose --profile app --profile monitoring up -d
  # На боевой машине (2 ГБ) не включён (docs/SECURITY_LIMITATIONS.md). Пароль
  # Grafana обязателен — без него объявится admin/admin на открытом порту.
  # Токен, которым Prometheus читает /api/metrics, — файл, не переменная
  # (deploy/monitoring/metrics-token, docs/DEPLOY.md, deploy/monitoring/README.md).
  prometheus:
    profiles: ['monitoring']
    image: prom/prometheus:v2.55.1
    container_name: skilllink-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./deploy/monitoring/metrics-token:/etc/prometheus/metrics-token:ro
      - skilllink-prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'

  grafana:
    profiles: ['monitoring']
    image: grafana/grafana-oss:11.3.1
    container_name: skilllink-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    # Пароль проверяется при запуске контейнера, а не при разборе файла: иначе
    # compose требует его и при выключенном профиле monitoring, и выкладка стенда падает.
    entrypoint: ['sh', '-c', '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "задайте GRAFANA_ADMIN_PASSWORD" >&2; exit 1; }; exec /run.sh']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/skilllink.json:/etc/grafana/provisioning/skilllink-dashboards/skilllink.json:ro
      - skilllink-grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'

volumes:
  skilllink-pgdata:
  skilllink-uploads:
  skilllink-prometheus-data:
  skilllink-grafana-data:
