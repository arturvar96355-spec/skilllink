services:
  postgres:
    image: postgres:16-alpine
    container_name: skilllink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skilllink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skilllink}
      POSTGRES_DB: ${POSTGRES_DB:-skilllink}
    ports:
      # Порт наружу настраивается: на машине разработчика PostgreSQL часто уже
      # занимает 5432, и стек не поднимется без возможности выбрать другой.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - skilllink-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-skilllink} -d ${POSTGRES_DB:-skilllink}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Приложение поднимается профилем: `docker compose --profile app up -d`.
  # Без профиля запускается только база — так удобнее разрабатывать локально.
  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skilllink-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skilllink}:${POSTGRES_PASSWORD:-skilllink}@postgres:5432/${POSTGRES_DB:-skilllink}?schema=public
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # ВНИМАНИЕ: имена переменных здесь намеренно НЕ совпадают с теми, что лежат
      # в .env проекта.
      #
      # Compose подставляет значения из .env в каталоге проекта, а первым шагом
      # установки человек делает `cp .env.example .env` — и в контейнер утекали
      # разработческие значения: DEMO_AUTH_ENABLED=true, то есть вход без пароля
      # вообще, и локальный секрет подписи. Контейнер при этом считался
      # промышленным, и README обещал, что демо-режим в нём выключен.
      #
      # Отдельные имена разрывают эту связь: что бы ни лежало в .env, контейнер
      # получает безопасные значения, а включить демо-режим можно только явно.

      # Секрет подписи сессий. Пустой — приложение откажется стартовать
      # в промышленном режиме с понятным сообщением (src/shared/auth/auth.ts).
      # Сгенерировать:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      AUTH_SECRET: ${DOCKER_AUTH_SECRET:-}
      # Вход без пароля по cookie. Включается только осознанно и только для показа.
      DEMO_AUTH_ENABLED: ${DOCKER_DEMO_AUTH_ENABLED:-false}
      # Публичный адрес, если перед приложением стоит прокси с HTTPS:
      #   DOCKER_AUTH_URL=https://skilllink.example
      # Без него после входа пользователя отправит на https://localhost:3000 —
      # Next.js собирает адрес запроса из собственного имени, а не из заголовка Host,
      # и NextAuth строит по нему все переходы. Пустое значение безопасно:
      # next-auth считает его незаданным (проверено).
      AUTH_URL: ${DOCKER_AUTH_URL:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      LMS_ENABLED: ${LMS_ENABLED:-false}
      SITE_ENABLED: ${SITE_ENABLED:-false}
    ports:
      - '${APP_PORT:-3000}:3000'

  # Разовая задача: применить миграции.
  #   docker compose --profile migrate run --rm migrate
  #
  # Собирается из ступени builder, а не из готового образа: в рантайм-образе лежит
  # только standalone-сервер, и CLI Prisma там намеренно нет.
  migrate:
    profiles: ['migrate']
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: skilllink-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skilllink}:${POSTGRES_PASSWORD:-skilllink}@postgres:5432/${POSTGRES_DB:-skilllink}?schema=public
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'

volumes:
  skilllink-pgdata:
